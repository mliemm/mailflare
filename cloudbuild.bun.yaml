steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.bun
      - -t
      - asia-southeast1-docker.pkg.dev/mliem-invoice-prod/apps/mailflare:bun-1
      - .
images:
  - asia-southeast1-docker.pkg.dev/mliem-invoice-prod/apps/mailflare:bun-1
options:
  machineType: E2_HIGHCPU_8
timeout: 2700s
